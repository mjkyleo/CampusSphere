# CampusSphere CI — GitHub Actions
#
# 触发：推送到 main / dev、对 main / dev 开 PR，或手动 workflow_dispatch。
# 并发：同一 ref 只跑最新一次；PR 会取消正在进行的旧运行，main/dev 推送不取消（保证发布链路完整）。
#
# 阶段：后端(lint → 测试分片并行 → 覆盖率合并) → 镜像 → 前端(lint · test · build)
#       → E2E(Playwright) → Worker 镜像 → 迁移校验 → 依赖审计 → 密钥扫描
#
# 后端测试为什么要「分片并行」：
#   全量 `pytest tests` 在本机实测约 12 分钟（>10 分钟会被环境中断），
#   串行跑既慢又无法定位瓶颈。按**目录 + 标记**切成 4 个分片后：
#     - unit        纯逻辑，实测 147 用例 / ~3s
#     - integration DB/降级集成，实测 ~129 用例 / ~348s（Celery .delay 在无 broker 时的连接重试是主要耗时）
#     - regression  根回归业务链路，实测 ~113 用例 / ~385s
#     - slow        文件上传等长 I/O 用例，独立隔离避免拖慢主分片
#   四个分片在 4 台 runner 上并行，墙钟时间由「最长分片」决定（≈7 分钟），
#   远低于原来 12 分钟的串行总时长；同时分片失败可快速定位到具体层。
#
# 覆盖率合并：每个分片用 `COVERAGE_FILE` 产出独立的 `.coverage.<shard>`，
#   上传为 artifact；`backend-coverage` job 下载全部数据 → `coverage combine`
#   合并为单个 `.coverage` → `coverage report --fail-under=70` 门禁 → 产出
#   coverage.xml / htmlcov 并上传。**不使用** pytest-cov 的并行 append
#   （在受限回收站环境会因删除临时文件失败导致 INTERNALERROR）。

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 同一分支只保留最新一次运行；PR 取消旧运行省算力，主分支推送不取消（避免发布验证被中断）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------- 后端：静态校验 ----------------
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app

  # ---------------- 后端：测试分片并行 ----------------
  # 每个分片是独立 runner：各自 checkout + 安装依赖（复用 pip 缓存）+ 跑指定子集。
  # 产物：① JUnit XML + pytest 日志（test-results-*）② 覆盖率数据（coverage-data-*）。
  backend-test:
    name: Backend test (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    needs: [backend-lint]
    timeout-minutes: ${{ matrix.shard.timeout }}
    defaults:
      run:
        working-directory: backend
    # 后端测试公共环境变量：测试库为隔离的临时 SQLite（见 tests/conftest.py），
    # 无需外部 PG/Redis/MinIO；关闭热点缓存避免内存降级字典在用例间残留。
    env:
      SECRET_KEY: ci-test-secret-not-for-prod
      JWT_ALGORITHM: HS256
      SCHOOL_CONFIG_PATH: ../config/school.yaml
      DEBUG: "false"
      CACHE_ENABLED: "false"
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: unit
            path: tests/unit
            args: ""
            timeout: 5
          - name: integration
            path: tests/integration
            args: -m "not slow"
            timeout: 20
          - name: regression
            path: tests
            args: --ignore=tests/unit --ignore=tests/integration -m "not slow"
            timeout: 20
          - name: slow
            path: tests
            args: -m slow
            timeout: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest (${{ matrix.shard.name }})
        run: |
          set -o pipefail
          COVERAGE_FILE=.coverage.${{ matrix.shard.name }} coverage run -m pytest \
            ${{ matrix.shard.path }} -q ${{ matrix.shard.args }} \
            --junitxml=junit-${{ matrix.shard.name }}.xml 2>&1 | tee pytest-${{ matrix.shard.name }}.log

      - name: Upload test results & log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard.name }}
          path: |
            backend/junit-${{ matrix.shard.name }}.xml
            backend/pytest-${{ matrix.shard.name }}.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.shard.name }}
          path: backend/.coverage.${{ matrix.shard.name }}
          if-no-files-found: warn
          retention-days: 1

  # ---------------- 后端：覆盖率合并与门禁 ----------------
  backend-coverage:
    name: Backend coverage gate (≥ 70%)
    runs-on: ubuntu-latest
    needs: [backend-test]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download all coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: backend
          merge-multiple: true

      - name: Combine, report and gate
        run: |
          ls -la .coverage.*
          coverage combine
          coverage report --fail-under=70
          coverage xml -o coverage.xml
          coverage html -d htmlcov || true

      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov
          if-no-files-found: warn
          retention-days: 7

  # ---------------- 后端：镜像构建校验（Dockerfile 可构建） ----------------
  backend-image:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: [backend-lint]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t campus-backend:ci -f Dockerfile .

  # ---------------- 前端：lint + 组件测试 + 构建 ----------------
  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # lint 脚本即 tsc --noEmit
      - name: Lint (tsc --noEmit)
        run: npm run lint

      # 组件测试：Vitest + React Testing Library（配置见 frontend/vitest.config.ts）
      - name: Unit tests with coverage (Vitest)
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: warn

  # ---------------- 端到端测试（Playwright，页面对象模式） ----------------
  # 由 Playwright 的 webServer 自动拉起后端(uvicorn:8000)与前端代理层(:5173)，
  # 并使用独立的 e2e_test.db，不污染任何开发/测试数据。
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-coverage, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          # 与 playwright.config.ts 中注入后端的环境变量保持一致
          ADMIN_GATEWAY_KEY: e2e-gateway-key
          ADMIN_PASSWORD: E2EAdminPass123456
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: warn
          retention-days: 7

  # ---------------- Worker 镜像构建 ----------------
  worker-image:
    name: Build worker image
    runs-on: ubuntu-latest
    needs: [backend-coverage]
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        # P2-26：实际部署用 backend/Dockerfile 的 worker target（deploy/Dockerfile.worker
        # 已声明废弃）——CI 必须构建真实镜像，绿灯才有意义。
        run: docker build -t campus-worker:ci --target worker -f backend/Dockerfile backend

  # ---------------- 数据库迁移校验（对应审计 P1-2） ----------------
  # 运行 alembic 迁移链，并用 `alembic check` 强制「模型变更须出迁移脚本」。
  migrations:
    name: DB migrations (alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: sqlite+aiosqlite:///./ci_migrations.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations (alembic upgrade head)
        run: alembic upgrade head

      - name: Verify models match migrations (alembic check)
        run: alembic check

  # ---------------- 依赖漏洞扫描（对应审计 P2-5） ----------------
  dependency-audit:
    name: Dependency audit (pip-audit · npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: pip-audit (backend)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit
          pip-audit

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  # ---------------- 密钥扫描（附加，对应审计 P0-3） ----------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
