# CampusSphere CI — GitHub Actions
#
# 触发：推送到 main / 对 main 开 PR
# 阶段：后端(lint · test · 镜像) → 前端(lint · build) → Worker 镜像 → 密钥扫描
#
# 范围（按用户选择）：静态校验 + 测试 + 构建。
# 自动部署**不在**本流水线（需仓库密钥/凭据，建议作为第二阶段单独加）。
# 密钥扫描(gitleaks)为附加项，对应审计 P0-3「secrets 扫描」；如不需要可删 secret-scan job。

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 同一分支只保留最新一次运行，节省算力
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- 后端：lint + 测试 + 镜像 ----------------
  backend:
    name: Backend (lint · test · image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app

      - name: Pytest with coverage
        env:
          # 测试用隔离 SQLite（见 tests/conftest.py），无需外部 PG/Redis
          SECRET_KEY: ci-test-secret-not-for-prod
          JWT_ALGORITHM: HS256
          SCHOOL_CONFIG_PATH: ../config/school.yaml
          DEBUG: "false"
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Build backend image
        run: docker build -t campus-backend:ci -f Dockerfile .

  # ---------------- 前端：lint + 构建 ----------------
  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # lint 脚本即 tsc --noEmit（前端目前无 eslint/测试框架）
      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: warn

  # ---------------- Worker 镜像构建（校验 Dockerfile 可构建） ----------------
  worker-image:
    name: Build worker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -t campus-worker:ci -f deploy/Dockerfile.worker backend

  # ---------------- 数据库迁移校验（对应审计 P1-2） ----------------
  # 运行 alembic 迁移链，并用 `alembic check` 强制「模型变更须出迁移脚本」，
  # 防止有人改了 ORM 模型却忘了补迁移（增量迁移安全网）。
  migrations:
    name: DB migrations (alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: sqlite+aiosqlite:///./ci_migrations.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations (alembic upgrade head)
        run: alembic upgrade head

      - name: Verify models match migrations (alembic check)
        run: alembic check

  # ---------------- 依赖漏洞扫描（对应审计 P2-5） ----------------
  # 后端用 pip-audit 审计已安装依赖（含传递依赖）；前端用 npm audit。
  # 发现高危漏洞时本 job 失败，作为合并前的安全闸门。
  dependency-audit:
    name: Dependency audit (pip-audit · npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: pip-audit (backend)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit
          pip-audit

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  # ---------------- 密钥扫描（附加，对应审计 P0-3） ----------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
