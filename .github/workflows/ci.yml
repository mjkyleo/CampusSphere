# CampusSphere CI — GitHub Actions
#
# 触发：推送到 main / 对 main 开 PR
# 阶段：后端(lint · test · 镜像) → 前端(lint · build) → Worker 镜像 → 密钥扫描
#
# 范围（按用户选择）：静态校验 + 测试 + 构建。
# 自动部署**不在**本流水线（需仓库密钥/凭据，建议作为第二阶段单独加）。
# 密钥扫描(gitleaks)为附加项，对应审计 P0-3「secrets 扫描」；如不需要可删 secret-scan job。

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 同一分支只保留最新一次运行，节省算力
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- 后端：lint + 测试 + 镜像 ----------------
  backend:
    name: Backend (lint · test · image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 后端测试公共环境变量（YAML 锚点，供下面各测试步骤复用）
    # 测试库为隔离的临时 SQLite（见 tests/conftest.py），无需外部 PG/Redis/MinIO
    env: &backend_env
      SECRET_KEY: ci-test-secret-not-for-prod
      JWT_ALGORITHM: HS256
      SCHOOL_CONFIG_PATH: ../config/school.yaml
      DEBUG: "false"
      # 关闭热点缓存，避免内存降级字典在用例间残留
      CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app

      # ------------------------------------------------------------------
      # 分层执行（unit → integration → 既有用例）
      # 为何不一次跑完：全部用例放在**同一个 pytest 进程**里时，
      # Windows 上偶发 aiosqlite 后台连接线程的原生 Abort（进程直接退出，无失败用例）。
      # 分进程按层执行可彻底规避，且失败时定位哪一层更快。
      # 覆盖率用 `coverage run --append` 累加（而非 pytest --cov-append）：
      # pytest-cov 会生成 .coverage.<host>.<pid>.<rand> 并行数据文件，
      # 合并后需要删除它们；在回收站不可用的受限环境里会因删除失败而
      # INTERNALERROR。`coverage run --append` 不产生并行临时文件，更稳。
      # ------------------------------------------------------------------
      - name: Pytest — 单元层（tests/unit）
        env: *backend_env
        run: coverage run -m pytest tests/unit -q

      - name: Pytest — 集成层（tests/integration，跳过 slow）
        env: *backend_env
        run: coverage run --append -m pytest tests/integration -q -m "not slow"

      - name: Pytest — 既有回归用例
        env: *backend_env
        run: |
          coverage run --append -m pytest tests -q \
            --ignore=tests/unit --ignore=tests/integration

      - name: Pytest — slow 标记用例（文件上传等）
        env: *backend_env
        run: coverage run --append -m pytest tests -q -m slow

      # 覆盖率门禁：低于阈值直接失败，防止"测试越加越少、覆盖率悄悄下滑"。
      #
      # 阈值说明（重要）：当前实测 TOTAL = 70%，因此门槛先设为 **70%** 作为
      # "防下滑基线"，而非直接写 80% —— 写 80% 会让流水线首次运行就变红，
      # 长期红灯的门禁很快会被忽略或删掉，反而失去意义。
      # 目标：随覆盖率提升按"棘轮"逐步上调至 80%（见 docs/TESTING.md §7）。
      - name: Coverage gate (≥ 70%, target 80%)
        run: |
          coverage report --fail-under=70
          coverage xml -o coverage.xml
          coverage html -d htmlcov || true

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

      - name: Build backend image
        run: docker build -t campus-backend:ci -f Dockerfile .

  # ---------------- 前端：lint + 构建 ----------------
  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # lint 脚本即 tsc --noEmit
      - name: Lint (tsc --noEmit)
        run: npm run lint

      # 组件测试：Vitest + React Testing Library（配置见 frontend/vitest.config.ts）
      # 覆盖率门槛按"棘轮"策略设定：当前仅覆盖少量组件，先设一个
      # 不会失败的基线值，随着用例增加再逐步上调（见 docs/TESTING.md）。
      - name: Unit tests with coverage (Vitest)
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: warn

  # ---------------- 端到端测试（Playwright，页面对象模式） ----------------
  # 由 Playwright 的 webServer 自动拉起后端(uvicorn:8000)与前端代理层(:5173)，
  # 并使用独立的 e2e_test.db，不污染任何开发/测试数据。
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          # 与 playwright.config.ts 中注入后端的环境变量保持一致
          ADMIN_GATEWAY_KEY: e2e-gateway-key
          ADMIN_PASSWORD: E2EAdminPass123456
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: warn
          retention-days: 7

  # ---------------- Worker 镜像构建（校验 Dockerfile 可构建） ----------------
  worker-image:
    name: Build worker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -t campus-worker:ci -f deploy/Dockerfile.worker backend

  # ---------------- 数据库迁移校验（对应审计 P1-2） ----------------
  # 运行 alembic 迁移链，并用 `alembic check` 强制「模型变更须出迁移脚本」，
  # 防止有人改了 ORM 模型却忘了补迁移（增量迁移安全网）。
  migrations:
    name: DB migrations (alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: sqlite+aiosqlite:///./ci_migrations.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations (alembic upgrade head)
        run: alembic upgrade head

      - name: Verify models match migrations (alembic check)
        run: alembic check

  # ---------------- 依赖漏洞扫描（对应审计 P2-5） ----------------
  # 后端用 pip-audit 审计已安装依赖（含传递依赖）；前端用 npm audit。
  # 发现高危漏洞时本 job 失败，作为合并前的安全闸门。
  dependency-audit:
    name: Dependency audit (pip-audit · npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: pip-audit (backend)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit
          pip-audit

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  # ---------------- 密钥扫描（附加，对应审计 P0-3） ----------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
