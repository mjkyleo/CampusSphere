[project]
name = "campus-life-platform"
version = "1.0.0"
description = "校园生活平台（Python 重写）后端 — FastAPI 模块化单体"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    # Web 框架
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # 数据层
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # 缓存 / 消息
    "redis>=5.0",
    "celery>=5.4",
    # 认证 / 安全
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.1",
    "cryptography>=42",
    # 对象存储
    "minio>=7.2",
    # 搜索
    "meilisearch>=0.32",
    # 可观测
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46",
    "structlog>=24.1",
    # HTTP 客户端（OAuth 调用）
    "httpx>=0.27",
    # YAML 配置
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
