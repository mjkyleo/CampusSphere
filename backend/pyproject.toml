[project]
name = "campus-life-platform"
version = "1.0.0"
description = "校园生活平台（Python 重写）后端 — FastAPI 模块化单体"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    # Web 框架
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # 数据层
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # 缓存 / 消息
    "redis>=5.0",
    "celery>=5.4",
    # 认证 / 安全
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.1",
    "cryptography>=42",
    # 对象存储
    "minio>=7.2",
    # 搜索
    "meilisearch>=0.32",
    # 可观测
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46",
    "structlog>=24.1",
    # HTTP 客户端（OAuth 调用）
    "httpx>=0.27",
    # 滑块验证（服务端生成拼图；Pillow 为业界标准图像处理库）
    "Pillow>=10.0",
    # YAML 配置
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "factory-boy>=3.3",
    "fakeredis>=2.20",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --strict-markers：拼错的标记会直接报错，避免 "静默不生效" 的分层筛选
addopts = "--strict-markers -rf"
markers = [
    "unit: 单元测试——纯函数 / 模块内部逻辑，无数据库与外部服务",
    "integration: 集成测试——API 端点 + 数据库 + Redis（外部服务走 mock）",
    "slow: 耗时较长的用例（搜索索引同步、文件上传等），日常可 -m 'not slow' 跳过",
    "external: 依赖外部服务（MinIO / Meilisearch / Celery）的用例，走内存或 mock 降级",
]

# ---------------------------------------------------------------------------
# 覆盖率：source 固定为 app，避免把 tests 自身算进分母导致虚高
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__pycache__/*", "*/alembic/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# Ruff 静态检查
#
# 为何要**显式列出**规则集：ruff 未配置时采用"当前版本的默认规则集"，
# 而该默认集会随版本扩大（0.16 相比 0.5 新增了 UP*/S/ASYNC/BLE/RUF 等），
# 导致 CI 在依赖解析到新版 ruff 时**突然变红**（历史代码 363 处报错）。
# 显式 select 让门禁结果可预期，与 ruff 版本解耦。
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 120
# alembic 迁移脚本为自动生成，不参与 lint
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E4",     # pycodestyle：缩进 / 空白等真实错误
    "E7",     # pycodestyle：语法类错误
    "E9",     # pycodestyle：语法错误（SyntaxError / IndentationError）
    "F",      # pyflakes：未用导入、重复定义、未用变量 —— 真实缺陷
    "W",      # pycodestyle 警告
    "I",      # isort：导入排序（可自动修复）
    "B",      # flake8-bugbear：常见陷阱（B008 已对 FastAPI DI 加白名单）
    "UP",     # pyupgrade：Python 3.12 现代语法（可自动修复）
    "ASYNC",  # 异步陷阱：async 函数内的阻塞调用等
    "RUF100", # 无用 noqa 指令（清理历史遗留）
]
ignore = [
    "UP046",  # PEP 695 泛型类语法：改动面大且非缺陷，单独排期
    "UP047",  # PEP 695 泛型函数语法：同上
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入**必须**写成参数默认值（Depends/Query/Path/...），
# 这是框架惯例而不是"可变默认参数"陷阱，故加入不可变调用白名单。
# 否则会误报 176 处 B008（占历史报错的近一半）。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    "fastapi.params.Depends",
    "fastapi.params.Query",
    "fastapi.params.Path",
    "fastapi.params.Body",
    "fastapi.params.Header",
    "fastapi.params.Cookie",
    "fastapi.params.Form",
    "fastapi.params.File",
    "fastapi.params.Security",
]
