[project]
name = "campus-life-platform"
version = "1.0.0"
description = "校园生活平台（Python 重写）后端 — FastAPI 模块化单体"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    # Web 框架
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # 数据层
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # 缓存 / 消息
    "redis>=5.0",
    "celery>=5.4",
    # 认证 / 安全
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.1",
    "cryptography>=42",
    # 对象存储
    "minio>=7.2",
    # 搜索
    "meilisearch>=0.32",
    # 可观测
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46",
    "structlog>=24.1",
    # HTTP 客户端（OAuth 调用）
    "httpx>=0.27",
    # 滑块验证（服务端生成拼图；Pillow 为业界标准图像处理库）
    "Pillow>=10.0",
    # YAML 配置
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "factory-boy>=3.3",
    "fakeredis>=2.20",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --strict-markers：拼错的标记会直接报错，避免 "静默不生效" 的分层筛选
addopts = "--strict-markers -rf"
markers = [
    "unit: 单元测试——纯函数 / 模块内部逻辑，无数据库与外部服务",
    "integration: 集成测试——API 端点 + 数据库 + Redis（外部服务走 mock）",
    "slow: 耗时较长的用例（搜索索引同步、文件上传等），日常可 -m 'not slow' 跳过",
    "external: 依赖外部服务（MinIO / Meilisearch / Celery）的用例，走内存或 mock 降级",
]

# ---------------------------------------------------------------------------
# 覆盖率：source 固定为 app，避免把 tests 自身算进分母导致虚高
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__pycache__/*", "*/alembic/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
