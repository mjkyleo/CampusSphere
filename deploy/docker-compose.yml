# 单校一键起：app + worker + pg + redis + minio + meili + nginx
# 用法：docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example up -d

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9001:9001"

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development
    volumes:
      - meildata:/meili_data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./deploy/.env.example
    environment:
      DB_URL: postgresql+asyncpg://campus:campus@postgres:5432/campus
      REDIS_URL: redis://redis:6379/0
      SCHOOL_CONFIG_PATH: /app/config/school.yaml
    volumes:
      - ./config:/app/config:ro
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.asgi:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: ../deploy/Dockerfile.worker
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ./deploy/.env.example
    environment:
      DB_URL: postgresql+asyncpg://campus:campus@postgres:5432/campus
      REDIS_URL: redis://redis:6379/0
      SCHOOL_CONFIG_PATH: /app/config/school.yaml
    volumes:
      - ./config:/app/config:ro

  nginx:
    image: nginx:1.25
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  pgdata:
  redisdata:
  miniodata:
  meildata:
