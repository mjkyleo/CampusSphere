# 单校一键起：前端构建 → app + worker + pg + redis + minio + meili + nginx
#
# 用法：
#   cp deploy/.env.example deploy/.env   # 先填真实配置（SMTP / 密钥 / 域名）
#   docker compose -f deploy/docker-compose.yml up -d
#
# 注意：env_file 指向 deploy/.env（**不是** .env.example）。
# 该文件缺失时 compose 会直接报错退出 —— 有意为之，避免用占位密钥上线。
#
# 证书：把 fullchain.pem / privkey.pem 放到 deploy/nginx/ssl/ 下。
#       暂无证书时可用 HTTP-only 配置先行验证：
#         NGINX_CONF=./nginx/nginx.http-only.conf docker compose -f deploy/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus}
      POSTGRES_DB: ${POSTGRES_DB:-campus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # 仅内网可达，不对外映射端口；如确需外部调试再临时加 ports
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # 凭据与 app 侧的 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 保持一致
      # 加引号：值里的 `?` 是 YAML 复杂键指示符，不引用会导致解析失败
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in deploy/.env}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in deploy/.env}"
    volumes:
      - miniodata:/data
    # 控制台端口仅建议内网访问，公网部署时请注释掉或加防火墙
    ports:
      - "9001:9001"

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: "${MEILI_API_KEY:?set MEILI_API_KEY in deploy/.env}"
      # 生产用 production：development 模式下索引会打印详细日志且放宽部分限制
      MEILI_ENV: ${MEILI_ENV:-production}
    volumes:
      - meildata:/meili_data

  # ---------------------------------------------------------------------------
  # 证书初始化：保证 nginx **总能启动**
  #   - 已放置 fullchain.pem / privkey.pem → 原样使用
  #   - 未放置 → 生成自签名证书，让 HTTPS 链路先跑通（浏览器会告警，仅联调用）
  # 生产请替换为真实证书，否则用户会遇到"证书不受信"告警。
  # ---------------------------------------------------------------------------
  cert-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        mkdir -p /ssl
        if [ -f /ssl/fullchain.pem ] && [ -f /ssl/privkey.pem ]; then
          echo "[cert-init] 检测到已有证书，直接使用"
        else
          echo "[cert-init] 未找到证书，正在生成自签名证书（***** 仅供联调，生产必须替换 *****）"
          apk add --no-cache openssl >/dev/null 2>&1
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /ssl/privkey.pem -out /ssl/fullchain.pem \
            -days 365 -subj "/CN=localhost" 2>/dev/null
          echo "[cert-init] 已生成 deploy/nginx/ssl/fullchain.pem 与 privkey.pem"
        fi
    volumes:
      - ./nginx/ssl:/ssl

  # ---------------------------------------------------------------------------
  # 前端构建：产出 dist/ 供 nginx 托管（拓扑 A：nginx 直出静态 + 反代 API/WS）
  # 构建完成即退出（service_completed_successfully），不常驻占用资源。
  # ---------------------------------------------------------------------------
  frontend-builder:
    # 用 slim（glibc）而非 alpine：esbuild 等原生二进制在 musl 上有兼容风险
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm ci && npm run build"
    volumes:
      - ../frontend:/app
      # 关键：把 node_modules 放进**匿名卷**。
      # 否则 npm ci 会写入宿主机的 frontend/node_modules，用 Linux 原生二进制
      # （esbuild 等）覆盖掉宿主机 Windows 版本的依赖，导致本地开发跑不起来。
      - /app/node_modules
      - frontend_dist:/app/dist

  app:
    # 注意路径基准：compose 中的相对路径一律以**本文件所在目录**（deploy/）解析，
    # 不是执行 docker compose 命令的工作目录。因此这里是 ../backend 而非 ./backend。
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: app
      # 镜像源加速：Docker Desktop 的代理**对容器内 apt/pip 无效**，
      # 而官方源在国内仅约 60 kB/s（装完 gcc 依赖需 30 分钟以上）。
      # 国内部署请在 deploy/.env 设置这两个变量；留空则回退官方源（海外 CI 适用）。
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
    image: campusphere-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./.env
    environment:
      DB_URL: postgresql+asyncpg://${POSTGRES_USER:-campus}:${POSTGRES_PASSWORD:-campus}@postgres:5432/${POSTGRES_DB:-campus}
      REDIS_URL: redis://redis:6379/0
      SCHOOL_CONFIG_PATH: /app/config/school.yaml
    volumes:
      - ../config:/app/config:ro
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.asgi:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: worker
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
    image: campusphere-worker:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DB_URL: postgresql+asyncpg://${POSTGRES_USER:-campus}:${POSTGRES_PASSWORD:-campus}@postgres:5432/${POSTGRES_DB:-campus}
      REDIS_URL: redis://redis:6379/0
      SCHOOL_CONFIG_PATH: /app/config/school.yaml
    volumes:
      - ../config:/app/config:ro

  nginx:
    image: nginx:1.25
    restart: unless-stopped
    # 统一用映射形式：短横线列表项与映射不能在同一缩进层级混用
    depends_on:
      app:
        condition: service_started
      frontend-builder:
        condition: service_completed_successfully
      cert-init:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 无证书时改用：NGINX_CONF=./nginx/nginx.http-only.conf
      - ${NGINX_CONF:-./nginx/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend_dist:/usr/share/nginx/html:ro

volumes:
  pgdata:
  redisdata:
  miniodata:
  meildata:
  frontend_dist:
