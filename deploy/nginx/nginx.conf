# 校园生活平台 Nginx 网关配置（生产：HTTPS 已启用）
# 职责：TLS 终止、HTTP→HTTPS 强制跳转、API/WS 反向代理、前端静态、限流、上传限制
#
# 证书：通过 deploy/docker-compose.yml 把证书目录挂载到 /etc/nginx/ssl
#       将 fullchain.pem 与 privkey.pem 放到 deploy/nginx/ssl/ 下（见该目录 README）。
#       自签 / Let's Encrypt 均可；生产务必使用可信证书。

upstream campus_app {
    server app:8000;
    # 多实例横向扩展时在此追加 server
}

# 限流：每 IP 每分钟 120 次
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

# ---------- HTTP：强制跳转 HTTPS ----------
server {
    listen 80;
    server_name _;
    # 如需 ACME 挑战（Let's Encrypt 签发），在此放开：
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS：强制浏览器仅经 HTTPS 访问（按需调整 max-age）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://campus_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # WebSocket 反向代理
    location /ws {
        proxy_pass http://campus_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Prometheus 指标（仅内网；按需调整为你的监控网段）
    location /metrics {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://campus_app;
    }
}
