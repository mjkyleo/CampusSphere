# 校园生活平台 Nginx 网关配置（**无证书 / HTTP-only 版**）
#
# 用途：证书尚未就绪时先用 HTTP 验证整条链路。
# 启用方式：
#   NGINX_CONF=./nginx/nginx.http-only.conf docker compose -f deploy/docker-compose.yml up -d
#
# ⚠️ 仅供内网或首次联调使用：
#    - 不启用 TLS，登录凭据与 Token 会明文传输；
#    - 对外服务请安装证书后改用默认 nginx.conf（强制 HTTPS + HSTS）。

upstream campus_app {
    server app:8000;
    # 多实例横向扩展时在此追加 server
}

# 限流：每 IP 每分钟 120 次
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://campus_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # WebSocket 反向代理
    location /ws {
        proxy_pass http://campus_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Prometheus 指标（仅内网；按需调整为你的监控网段）
    location /metrics {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://campus_app;
    }
}
