global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则（对应审计 P2-10）
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'campus-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8000']
        labels:
          service: 'campus-life-platform'

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
