global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则（对应审计 P2-10）
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'campus-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8000']
        labels:
          service: 'campus-life-platform'

  # P3：nginx:80 抓取目标默认拓扑（core profile，无 gateway）下常驻 DOWN，
  # `up{job="nginx"} == 0` 告警长期误报（狼来了）。该目标仅在 gateway profile
  # 有意义——部署网关拓扑时取消注释并确认 prometheus 能解析 nginx 主机名。
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx:80']
