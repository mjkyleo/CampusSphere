global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'campus-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8000']
        labels:
          service: 'campus-life-platform'

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
