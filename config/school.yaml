# 单校配置模板 —— 部署新校时复制本文件并修改字段即可（"改配置即上线"）
school_name: "示例大学"
school_domain: "campus.example.edu.cn"

# OAuth 第三方登录凭据（微信/QQ 开放平台）
oauth:
  wechat:
    appid: "wx_appid_placeholder"
    secret: "wx_secret_placeholder"
  qq:
    appid: "qq_appid_placeholder"
    secret: "qq_secret_placeholder"
  # state 防 CSRF 有效期（秒）
  state_ttl: 300

# 账号体系：邮箱注册规则（可在后台 /api/admin/auth/email-config 动态覆盖）
auth:
  email_register:
    # 是否允许邮箱注册 / 绑定邮箱
    enabled: true
    # 允许注册的邮箱域名白名单（空列表表示不限制域名）
    domains:
      - example.edu.cn
      - example.com
    # 可选：额外的正则校验（如学号格式邮箱）；留空表示不校验
    pattern: ""

# MinIO / S3 兼容对象存储
minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  secure: false
  bucket: "campus"
  # 临时签名 URL 有效期（秒）
  presigned_ttl: 600

# Meilisearch 搜索
meilisearch:
  host: "http://localhost:7700"
  api_key: "masterKey"
  # 索引主键与中文分词
  indices:
    users: "users"
    items: "items"

# 自动封禁规则（举报模块）
report_policy:
  # 同一用户被举报次数达到阈值则自动封禁
  auto_ban_threshold: 5
  # 单个工单处理时限（小时），超时自动升级
  escalate_hours: 48

# 二手物品（可在后台 /api/admin/items/categories 与 /items/review-config 动态覆盖）
items:
  review:
    # 是否启用"发布后审核再上架"：false=发布即上架；true=进入待审核(PENDING)
    enabled: false
  # 二手交易分类（后台可动态配置；"全部"为前端筛选用，不存入此列表）
  categories:
    - 电子产品
    - 书籍资料
    - 日用百货
    - 交通工具
    - 运动户外
    - 美妆服饰
    - 其他

# 课程评价（可在后台 /api/admin/courses/departments 动态覆盖）
courses:
  # 开课院系列表（后台可动态配置；课程发布时从该列表选择）
  departments:
    - 计算机学院
    - 软件学院
    - 数学科学学院
    - 经济管理学院
    - 外国语学院
    - 通识教育中心

# AI 智能助手（Gemini）—— 可在后台 /api/admin/ai/config 动态覆盖开关与模型
ai:
  # 功能总开关：false=前端隐藏所有 AI 入口（个人开发者无 API 额度时的默认态）
  #             true=开放首页灵感/物品润色/课程画像等 AI 能力
  feature:
    enabled: false
    # Gemini 模型名（如 gemini-2.0-flash / gemini-2.0-flash-lite）
    model: "gemini-2.0-flash"
  # API Key 推荐用环境变量 GEMINI_API_KEY 注入；此处仅作兜底配置位
  api_key: ""
